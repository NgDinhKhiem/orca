name: Relay Windows process-tree addons

# Why a reusable workflow: every desktop package ships relays for Windows SSH hosts,
# but only a Windows runner can compile the addon that launches a relay outside
# sshd's job. macOS and Linux packaging jobs download this artifact into
# .build/windows-process-tree before `pnpm build:release` stages it.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build; must match what the packaging job checks out.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # Why windows-2022: windows-latest moved to VS 2026 before node-gyp could detect
    # it. GitHub-hosted, so release-cut's SignPath provenance rule still holds.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Plain setup rather than a composite action: `uses: ./` resolves from the
      # checked-out ref, which may be a release tag that predates the action.
      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Why host-only: the addon is compiled from the patched source pnpm
      # materializes, and arm64 cross-compiles through node-gyp --arch.
      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # The build script refuses unpatched source and checks each output's PE
      # machine, ReadProcessMemory import, and spawnOutsideJob export.
      - name: Build Windows process-table addons for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Upload relay addons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-windows-process-tree
          path: .build/windows-process-tree/
          if-no-files-found: error
          retention-days: 7
          # A rerun attempt re-uploads under the same name, which is otherwise refused.
          overwrite: true
