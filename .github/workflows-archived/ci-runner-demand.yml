name: CI runner demand

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-runner-demand
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: config/scripts
          persist-credentials: false
      - name: Measure the previous complete 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: node config/scripts/ci-runner-demand.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-demand-${{ github.run_id }}
          path: ci-demand/
          retention-days: 30
