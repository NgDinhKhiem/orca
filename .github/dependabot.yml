version: 2
updates:
  # Why only ripgrep: the bundled rg ships in every artifact and to SSH remotes, and a bump is a
  # one-line pin change (the SSH cache keys on the binary's hash). Other dependencies stay manual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: '@vscode/ripgrep-universal'
    open-pull-requests-limit: 1
  # Why: cloud Dockerfiles pin base images by digest; this keeps those digests current.
  - package-ecosystem: docker
    directories:
      - /cloud/apps/relay
      - /cloud/apps/push
      - /cloud/apps/relay-fence-broker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  # Why: workflow actions are pinned to commit SHAs; this keeps the pins and their `# vN` comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
